databases:
  - name: kinesis-db
    databaseName: kinesis
    user: kinesis_user
    plan: free

services:
  # ── Redis ──────────────────────────────────────────────────────────────────
  - type: redis
    name: kinesis-redis
    plan: free
    ipAllowList: []

  # ── Flask Backend ──────────────────────────────────────────────────────────
  - type: web
    name: kinesis-server
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: flask db upgrade && python run.py
    plan: free
    envVars:
      - key: FLASK_APP
        value: run.py
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kinesis-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: kinesis-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # ── React Frontend ─────────────────────────────────────────────────────────
  - type: web
    name: kinesis-client
    runtime: node
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          name: kinesis-server
          type: web
          property: host
          envVarKey: VITE_API_URL
      - key: VITE_WALLETCONNECT_PROJECT_ID
        sync: false
